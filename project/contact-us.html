<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <meta name="description" content="This is a branch page connected to the page for the siteplan project for te web fundamentals WDD131 week five">
  <meta name="author" content="Job Gamutambuli">
  <link rel="stylesheet" href="styles/siteplan.css">
  <link rel="stylesheet" href="styles/siteplan-large.css">
  <script src="scripts/siteplan.js" defer></script>
</head>
<body>
  <header>
    <div class="heading">
      <div class="icon">
        <img src="images/bakery-icon.webp" alt="Bakery Icon">
      </div>
      <div class="title">
        <h1>Sweet Cakes Bakery</h1>
        <button type="button" id="menu" class="contactmenu"></button>
      </div>
    </div>
    <nav class="navigation">
      <ul>
        <li><a href="siteplan.html">Home</a></li>
        <li><a href="about-us.html">About Us</a></li>
        <li><a href="contact-us.html">Contact Us</a></li>
        <li><a href="products.html">Our Products</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <form action="submission.html" method="get">
      <h2>For more information and inquiries. Fill the form.</h2>
      <div>
        <label for="firstname">First Name: </label>
        <input type="text" id="firstname" name="firstname" required>
      </div>
      <div>
        <label for="secondname">Second Name:</label>
        <input type="text" id="secondname" name="secondname">
      </div>
      <div>
        <label for="email">Email Address:</label>
        <input type="text" id="email" name="email" required>
      </div>
      <div class="information">
        <label for="information">Information</label>
        <textarea name="information" id="information" cols="20" rows="3" required></textarea>
      </div>
      <div class="labl">
        <label for="submissiondate">Date of submission</label>
        <input type="date" id="submissiondate" name="submissiondate" required>
      </div>
      <div class="submit">
        <input type="submit" value="Post Submission" class="submission">
      </div>
    </form>
  </main>
  
  <footer>
    <p><span id="currentYear"></span></p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
